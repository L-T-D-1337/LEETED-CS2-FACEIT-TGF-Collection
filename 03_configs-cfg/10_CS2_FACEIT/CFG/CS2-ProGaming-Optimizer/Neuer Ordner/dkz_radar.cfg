// ============================================================
// DkZ devkitz - Radar & Overview Optimierung
// v1.01.1_Session01_Step04
// Separate Datei - CSAFAP bleibt 100% unveraendert.
// Laden: "exec dkz_radar" in der Konsole (oder in autoexec).
// ============================================================

// --- Radar oben links: mehr Uebersicht ---
cl_hud_radar_scale 1.15          // Radar-HUD groesser (0.8 - 1.3)
cl_radar_scale 0.42              // Zoom raus = mehr Karte sichtbar
cl_radar_always_centered 0       // Nicht auf Spieler zentriert = ganze Map nutzbar
cl_radar_rotate 1                // Radar dreht mit Blickrichtung (0 = fix wie Overview)
cl_radar_icon_scale_min 0.7      // Spieler-Icons gut lesbar
cl_radar_square_with_scoreboard 1 // Eckiges Radar bei offenem Scoreboard

// --- Eigene Position als Callout-Text im HUD ---

// --- Teammate-Info ueber Koepfen (hilft bei Callout-Kommunikation) ---
cl_teamid_overhead_mode 3

echo "[DkZ] dkz_radar.cfg geladen - Radar optimiert."
