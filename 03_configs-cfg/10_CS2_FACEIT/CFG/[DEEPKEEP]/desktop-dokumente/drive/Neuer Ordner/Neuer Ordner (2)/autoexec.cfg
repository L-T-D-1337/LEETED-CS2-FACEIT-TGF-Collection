// ============================================================================

// ============ GRENADE RADIO BINDS ============
alias +[rr1] "+radialradio"
alias +[rr2] "+radialradio2"
alias +[rr3] "+radialradio3"
alias -[rr1] "-radialradio"
alias -[rr2] "-radialradio2"
alias -[rr3] "-radialradio3"
alias {brad1} "bind z +[rr1]"
alias {brad2} "bind x +[rr2]"
alias {brad3} "bind c +[rr3]"
alias {rrbind} "bind f _r"
alias brad "{brad1};{brad2};{brad3};{rrbind}"

// ============================================================================
// TEAM MSG BIND ALIASES
// ============================================================================

// ============ TEAM MSGS ============
alias @msg "bind F9 repbot; bind F10 bla; bind F11 ts; bind F12 eng"

// ============================================================================
// FACEIT F-KEY ALIASES
// ============================================================================

// ============ FACEIT F-TASTEN ============
alias {f5stay} "bind F5 +f_stay"
alias {f6switch} "bind F6 +f_switch"
alias {f7gg} "bind F7 f_gg"
alias {f8report} "bind F8 f_report"
alias @facekeys "{f5stay};{f6switch};{f7gg};{f8report}"

// ============================================================================
// DECO WITH HAND ALIASES
// ============================================================================

// ============ DECO (mit <hand) ============
alias deco "give weapon_decoy; <hand;showon"

// ============================================================================
// CHAIN FORWARD ALIASES
// ============================================================================

// ============ 5-STEP FORWARD CHAIN (jetzt >) ============
alias fb_>[1]_ ">[2]; move>;"
alias fb_>[2]_ ">[3]; +[funkbar];"
alias fb_>[3]_ ">[4]; [1]funkbind;"
alias fb_>[4]_ ">[5]; brad; {rrbind}; @msg;"
alias fb_>[5]_ "faceit1; @facekeys; deco; alias _next_forward _noop"
alias +[chain] "_next_forward; alias _next_forward fb_>[1]_"

// ============================================================================
// CHAIN BACKWARD ALIASES
// ============================================================================

// ============ 5-STEP BACKWARD CHAIN (jetzt <) ============
alias fb_<[1]_ "<[2]; -[funkbar];"
alias fb_<[2]_ "<[3]; -fuk_;"
alias fb_<[3]_ "<[4]; [0]funkbind;"
alias fb_<[4]_ "<[5]; faceit0;"
alias fb_<[5]_ "deco; alias _next_back _noop"
alias -[chain] "_next_back; alias _next_back fb_<[1]_

// ============================================================================
// CHAIN INIT
// ============================================================================

// ============ INIT ============
alias _next_forward fb_>[1]_
alias _next_back fb_<[1]_

echo "RUN ALIAS ! <END"
