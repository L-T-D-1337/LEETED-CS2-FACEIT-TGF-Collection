alias [0]hudmode "-radarzoom;cl_teamcounter_playercount_instead_of_avatars 1;cl_show_equipped_character_for_player_avatars 1;cl_sanitize_player_names true;cl_hide_avatar_images 0;cl_mute_enemy_team 1"
